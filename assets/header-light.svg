<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Berke Ugur - Software Engineer, Istanbul">
  <title>Berke Ugur — Software Engineer, Istanbul</title>
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .fade   { opacity: 0; animation: fade .7s ease-out forwards; }
      .d-sub1 { animation-delay: 2.5s; }
      .d-sub2 { animation-delay: 2.9s; }
      .d-tag  { animation-delay: 3.3s; }
      .d-wave { animation-delay: 3.1s; }
      @keyframes fade { to { opacity: 1; } }

      .cursor { opacity: 0; animation: blink 1.06s steps(1) 1.5s infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

      .roll  { animation: roll 1.1s linear infinite; }
      @keyframes roll { to { transform: translateY(4px); } }

      .sweep { animation: sweep 6.5s linear 1s infinite; }
      @keyframes sweep { from { transform: translateY(-90px); } to { transform: translateY(275px); } }

      .pulse { stroke-dasharray: 34 420; animation: dash 2.8s linear infinite; }
      @keyframes dash { from { stroke-dashoffset: 34; } to { stroke-dashoffset: -420; } }

      .flick { animation: flick 5s ease-in-out .5s infinite; }
      @keyframes flick { 0%,92%,100% { opacity: 1; } 94% { opacity: .93; } 96% { opacity: 1; } 98% { opacity: .96; } }

      @media (prefers-reduced-motion: reduce) {
        .fade { opacity: 1; animation: none; }
        .cursor { opacity: 1; animation: none; }
        .roll, .sweep, .pulse, .flick { animation: none; }
      }
    </style>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#1A1712" opacity="0.055"/>
    </pattern>
    <linearGradient id="sweepg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#B4520A" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#B4520A" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#B4520A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panelclip"><rect x="18" y="14" width="960" height="212" rx="2"/></clipPath>

    <!-- yazi makinesi maskeleri: SMIL desteklenmezse authored width tam, metin gorunur kalir -->
    <clipPath id="clipCmd">
      <rect x="112" y="52" width="120" height="34">
        <animate attributeName="width" values="0;16;32;48;64;80;96" dur=".78s" begin=".55s"
                 calcMode="discrete" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clipName">
      <rect x="52" y="98" width="620" height="62">
        <animate attributeName="width" from="0" to="620" dur=".62s" begin="1.65s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- zemin -->
  <rect width="1000" height="260" fill="#EDE6D8"/>

  <!-- kaydirilmis sert golge + panel -->
  <rect x="22" y="18" width="960" height="212" rx="2" fill="#1A1712"/>
  <rect x="18" y="14" width="960" height="212" rx="2" fill="#F6F1E6" stroke="#1A1712" stroke-width="1.25"/>

  <g clip-path="url(#panelclip)" class="flick">
    <!-- baslik cubugu -->
    <rect x="18" y="14" width="960" height="30" fill="#E4DBC9"/>
    <line x1="18" y1="44" x2="978" y2="44" stroke="#1A1712" stroke-width="1.25"/>
    <g fill="#B4520A">
      <rect x="34" y="24" width="9" height="9"/>
      <rect x="50" y="24" width="9" height="9" opacity=".6"/>
      <rect x="66" y="24" width="9" height="9" opacity=".3"/>
    </g>
    <text class="mono" x="92" y="33" font-size="12.5" letter-spacing="1.6" fill="#6B6255">berke@istanbul — zsh</text>
    <text class="mono" x="962" y="33" font-size="12.5" letter-spacing="1.6" fill="#6B6255" text-anchor="end">01</text>

    <!-- komut satiri -->
    <text class="mono" x="52" y="76" font-size="22" fill="#B4520A">&#8250;</text>
    <g clip-path="url(#clipCmd)">
      <text class="mono" x="112" y="76" font-size="22" letter-spacing=".5" fill="#1A1712">whoami</text>
    </g>

    <!-- isim -->
    <g clip-path="url(#clipName)">
      <text class="mono" x="52" y="142" font-size="50" font-weight="700" letter-spacing="2.5" fill="#1A1712">BERKE U&#286;UR</text>
    </g>
    <rect class="cursor" x="392" y="106" width="24" height="44" fill="#B4520A"/>

    <!-- alt satirlar -->
    <text class="mono fade d-sub1" x="53" y="176" font-size="15" letter-spacing="1.1" fill="#6B6255">Software Engineer &#183; &#304;stanbul &#183; berkeugur.com</text>
    <text class="mono fade d-sub2" x="53" y="200" font-size="13.5" letter-spacing="2.2" fill="#8A4208">FLUTTER &#183; NESTJS &#183; NEXT.JS &#183; REDIS &#183; GO</text>

    <!-- osiloskop izi -->
    <g class="fade d-wave">
      <path id="wave" d="M604 214 L640 214 L652 194 L664 214 L704 214 L716 226 L728 214 L794 214 L806 190 L818 214 L864 214 L876 222 L888 214 L962 214"
            fill="none" stroke="#B4520A" stroke-width="1.5" stroke-linejoin="round" opacity=".26"/>
      <use href="#wave" class="pulse" stroke="#B4520A" stroke-width="2" opacity="1"/>
      <text class="mono" x="962" y="176" font-size="10.5" letter-spacing="2.6" fill="#6B6255" text-anchor="end">REAL-TIME SYSTEMS</text>
    </g>

    <!-- CRT dokusu -->
    <g class="roll"><rect x="18" y="10" width="960" height="224" fill="url(#scan)"/></g>
    <g class="sweep"><rect x="18" y="14" width="960" height="90" fill="url(#sweepg)"/></g>
  </g>
</svg>
